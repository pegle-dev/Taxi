<meta charset="utf-8">
<title>막차</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 글꼴: 갈무리(Galmuri, SIL OFL 1.1, quiple). 비트맵 글꼴이라 정해진 배수 크기에서만 또렷하다.
   Galmuri14 = 15px의 배수(본문), Galmuri11 = 12px의 배수(UI·네비·미터). 자간도 정수 px.
   빌드 스크립트가 아래 CDN 주소를 vendor/galmuri/ 사본으로 바꾼다. */
@font-face{font-family:Galmuri14;font-weight:400;font-display:swap;src:url("https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri14.woff2") format("woff2")}
@font-face{font-family:Galmuri11;font-weight:400;font-display:swap;src:url("https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2") format("woff2")}
@font-face{font-family:Galmuri11;font-weight:700;font-display:swap;src:url("https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2") format("woff2")}
/* layout: 16:9 저해상도 화면이 무대 전체. 글은 화면 아래 얇은 검정 상자 하나, 선택지는 그 오른쪽 세로 한 줄. */
:root{
  color-scheme:dark;
  --ink:#070a0a; --night:#101a1f; --moss:#34463f; --line:#6b7d73; --paper:#c9d2c4;
  --mint:#6ff0b4; --mint-dim:#2f8f6c; --red:#9a2f2a;
  --prose:Galmuri14,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ui:Galmuri11,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%}
/* .ov{display:flex} 등이 hidden 속성을 이기지 않게. 빌드 틀에도 있지만 game/index.html을 바로 열 때를 위해 여기도 둔다 */
[hidden]{display:none!important}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);font-size:12px;overflow:hidden;font-synthesis:none;
  -webkit-font-smoothing:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));max-width:100%}
#c{display:block;width:100%;aspect-ratio:16/9;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--ink)}
#ui{position:absolute;inset:auto 0 0 0;display:flex;gap:12px;align-items:flex-end;
  padding-block:0 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:opacity .08s}
#ui.off{opacity:0;pointer-events:none}
#dlg{flex:1 1 0;min-width:0;position:relative;background:rgba(7,10,10,.82);border:1px solid var(--line);
  padding:14px 18px 16px;min-height:104px;cursor:pointer}
#who{position:absolute;top:-11px;left:14px;background:var(--ink);border:1px solid var(--line);
  font-size:12px;letter-spacing:1px;padding:1px 10px;color:var(--paper)}
#who:empty{display:none}
#text{margin:0;font-family:var(--prose);font-size:15px;line-height:26px;white-space:pre-wrap;word-break:keep-all}
/* 비트맵 글꼴엔 굵은 꼴이 없어서, 옛날 게임처럼 1px 겹쳐 찍어 굵게 한다 */
#text.said{text-shadow:1px 0 currentColor}
#next{position:absolute;right:12px;bottom:6px;font-style:normal;font-size:12px;color:var(--line);animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#san{position:absolute;left:0;right:0;top:-1px;height:1px;background:transparent}
#san i{display:block;height:1px;background:var(--paper);width:100%;transition:width .6s}
#sanl{position:absolute;right:10px;top:-8px;background:var(--ink);font-size:12px;line-height:15px;letter-spacing:2px;color:var(--line);padding:0 6px}
#side{flex:0 0 min(34%,330px);display:flex;flex-direction:column;gap:6px}
#side:empty{display:none}
#obs{display:flex;flex-wrap:wrap;gap:4px}
#obs button{flex:1 1 auto;font:inherit;font-size:12px;letter-spacing:0;color:var(--line);background:rgba(7,10,10,.82);
  border:1px solid var(--moss);padding:5px 4px;cursor:pointer}
#obs button:hover,#obs button:focus-visible{color:var(--paper);border-color:var(--line);outline:none}
#obs button:disabled{opacity:.3;cursor:default}
.ch{font-family:var(--prose);font-size:15px;line-height:22px;text-align:left;color:var(--line);
  background:rgba(7,10,10,.82);border:1px solid var(--moss);padding:7px 12px 7px 26px;cursor:pointer;position:relative;word-break:keep-all}
.ch.sel{color:var(--mint);border-color:var(--mint)}
.ch.sel::before{content:"▶";position:absolute;left:9px;top:7px;font-family:var(--ui);font-size:12px;line-height:22px}
.ch:focus-visible{outline:1px solid var(--mint)}
#timer{height:1px;background:var(--moss)}
#timer i{display:block;height:1px;background:var(--line);width:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:18px;
  background:rgba(7,10,10,.86);padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.ov>div{width:min(560px,100%);margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ov h1{font-family:var(--prose);font-weight:400;font-size:60px;margin:0;letter-spacing:4px;line-height:1}
.ov h1 small{display:block;font-family:var(--ui);font-weight:400;font-size:12px;letter-spacing:7px;color:var(--line);margin-top:12px}
.ov h2{font-family:var(--prose);font-weight:400;font-size:30px;line-height:1.2;margin:0}
.ov p,.ov li{font-family:var(--prose);font-size:15px;line-height:26px;margin:0;word-break:keep-all;color:var(--paper)}
.ov ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--moss);border-bottom:1px solid var(--moss);padding-block:10px}
.ov .dim{color:var(--line);font-family:var(--ui);font-size:12px;line-height:18px;letter-spacing:0}
.ov .num{font-variant-numeric:tabular-nums}
.go{align-self:flex-start;font-family:var(--prose);font-size:15px;color:var(--mint);background:transparent;
  border:1px solid var(--mint);padding:9px 22px;cursor:pointer}
.go:hover,.go:focus-visible{background:var(--mint);color:var(--ink);outline:none}
#mute{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:5;font:inherit;font-size:12px;letter-spacing:1px;
  color:var(--line);background:transparent;border:1px solid var(--moss);padding:3px 8px;cursor:pointer}
@media (max-aspect-ratio:1/1){
  #app{justify-content:flex-start}
  #stage{width:100%;display:flex;flex-direction:column;min-height:100%}
  #ui{position:static;flex-direction:column;align-items:stretch;padding-block:16px 14px;flex:1}
  #side{flex:0 0 auto}
  #dlg{flex:0 0 auto;min-height:150px}
  .ch{padding-block:11px}.ch.sel::before{top:11px}
  #obs button{padding:9px 4px}
  .ov{position:fixed}
}
@media (prefers-reduced-motion:reduce){#next{animation:none}}
</style>

<div id="app"><div id="stage">
  <canvas id="c" width="480" height="270"></canvas>
  <button id="mute" type="button">소리 켬</button>
  <div id="ui" class="off">
    <div id="dlg"><div id="san"><i></i></div><span id="sanl">정신력</span><span id="who"></span><p id="text"></p><i id="next">▼</i></div>
    <div id="side"></div>
  </div>
  <div class="ov" id="title"><div>
    <h1>막차<small>LAST RIDE</small></h1>
    <p>당신은 심야의 택시 운전사다.<br>어떤 손님이라도 원하는 곳까지 태워다 주는 것이 회사의 방침이다.</p>
    <ul>
      <li>하나. 손님을 가리지 않는다.</li>
      <li>둘. 손님과의 대화는 신중하게. 침묵도 선택이다.</li>
      <li>셋. 눈을 뗄 수 있는 것은 한 번에 한 곳뿐이다.</li>
      <li>넷. 도착하면, 도착을 알린다.</li>
    </ul>
    <p class="dim" id="best">하룻밤 손님 셋 · 약 5분 · 소리를 켜는 것을 권합니다</p>
    <button class="go" id="start" type="button">시동을 건다</button>
  </div></div>
</div></div>

  const paint=()=>btns.forEach((b,i)=>b.classList.toggle('sel',i===sel));paint();
  const iv=setInterval(()=>{if(paused||done)return;left-=.1;tm.firstChild.style.width=Math.max(0,left/22*100)+'%';if(left<=0){sel=opts.length-1;ctl.pick()}},100);
  const ctl=choiceCtl={move(d){sel=(sel+d+opts.length)%opts.length;paint()},
    pick(){if(done||paused)return;done=true;clearInterval(iv);choiceCtl=null;elSide.innerHTML='';resolve(opts[sel])},
    async obs(i){if(looked||paused||done)return;looked=true;paused=true;choiceCtl=null;[...ob.children].forEach(b=>b.disabled=true);elSide.hidden=true;
      try{await ctx.observe(OBS[i][0])}catch(e){done=true;clearInterval(iv);elSide.innerHTML='';elSide.hidden=false;return ctx.fail(e)}
      elSide.hidden=false;if(beat.say)await showStatic(beat.say);paused=false;choiceCtl=ctl}};
})}
async function showStatic(l){elWho.textContent=l.who||'';elText.classList.toggle('said',!!l.who);elText.textContent=l.t||l;elNext.hidden=true}

  choices:[{t:'"집이 어디니?"',san:-5,doom:1,out:[{who:'아이',t:'거기요.'},'아이가 네비를 가리킨다. 손가락이 앞좌석까지 닿는다. 닿을 수 없는 거리인데.']},
   {t:'"부모님은 어디 계시니?"',san:-9,doom:1,out:[{who:'아이',t:'집에요. 계속 집에 있어요. 못 나와요.'}]}],
  silence:{san:0,out:'당신은 출발한다. 아이는 다리를 흔든다. 시트에 뒤꿈치가 부딪히는 소리는 나지 않는다.'}},
 {trapBack:1,text:'신호 대기. 와이퍼 소리. 아이의 목소리는 뒷좌석이 아니라 귀 바로 옆에서 들린다.',say:{who:'아이',t:'아저씨, 아저씨 뒤에 누구예요?'},

   {t:'"장난치지 마라."',san:-10,doom:1,out:['웃음소리가 뚝 그친다. 차 안의 온도가 내려간다.',{who:'아이',t:'장난 아닌데.'},'이번에는, 어른의 목소리였다.']}],
  silence:{san:1,out:'대답하지 않는다. 돌아보지도 않는다. 아이는 금세 흥미를 잃고 창문에 입김으로 그림을 그린다.\n창문은 흐려지지 않는다.'}},
 {navi:{twist:1,glitch:.3,dest:'집 집 집'},text:'갈림길. 네비의 선이 스스로 말려 들어간다. 같은 골목을 세 번 도는 경로. 그 끝은 저수지다.',say:{who:'아이',t:'왼쪽이요. 집은 왼쪽.'},
  choices:[{t:'아이 말대로 왼쪽으로 간다',san:1,navi:{off:true},out:'왼쪽 골목. 가로등이 하나씩 켜진다. 누가 마중 나오듯이.\n네비는 경로 이탈을 알리지 않는다. 화면이 그냥 꺼졌다.'},
   {t:'네비를 따른다',san:-15,doom:2,scare:1,out:'같은 전봇대를 세 번 지난다. 네 번째 전봇대 옆에는 아이가 서 있다. 뒷좌석에도 아이가 있다.\n둘이 서로에게 손을 흔든다.'}],
  silence:{t:'…… (망설인다)',san:-6,doom:1,out:[{who:'아이',t:'아저씨도 길 몰라요? 그럼 아저씨도 못 가겠네. 집에.'}]}},
 {stop:1,text:'불 꺼진 다세대 주택. 2층 창문 하나만 열려 있다.',say:{who:'아이',t:'아저씨, 들어와서 물 마시고 가요. 엄마가 그러랬어요.'},
  choices:[{t:'"괜찮다. 어서 들어가."',san:3,out:'아이는 입을 삐죽이고 내린다. 문은 열리지 않았는데.'},
   {t:'"……그래, 잠깐만."',san:-20,doom:3,scare:1,out:'안전벨트를 푸는 손이 당신의 손 같지 않다. 2층 창문에서 누군가 내려다본다. 엄마라고 하기에는, 목이 너무 길다.'}],
  silence:{san:-5,out:[{who:'아이',t:'다음에요.'},'아이는 한참 기다리다 혼자 내린다. 다음이라는 말이 오래 남는다.']}}],
 obs:{mirror:()=>({t:'룸미러에는 뒷좌석 시트만 비친다. 아이는 키가 작아서 안 보이는 것이다.\n그렇게 생각하기로 한다.',san:-3}),
  side:()=>({t:'사이드미러. 차 옆을 따라 뛰는 작은 그림자가 있다. 뒷좌석의 아이와 같은 옷이다.',san:-6}),
  navi:()=>({t:"'집'이라는 글자가 깜빡인다. 거리는 줄지 않는다. 3.3 km. 3.3 km. 3.4 km.\n이 선을 따라가면 안 된다.",san:-2}),
  back:(i,n,b)=>b.trapBack?{t:'돌아본다. 아이는 얌전히 앉아 있다.\n그리고 운전석 헤드레스트 뒤, 방금까지 당신의 머리가 있던 바로 그 자리에, 얼굴 하나가 당신과 같은 각도로 고개를 돌리고 있다.',san:-18,doom:1,scare:1}:{t:'아이는 얌전히 앉아 있다. 얼굴이 어둡다. 그늘이 져서가 아니라, 그릴 것이 없는 얼굴이라서.',san:-8,flash:1}},
 good:'아이가 계단을 올라간다. 발소리는 없다. 2층 창문이 닫힌다.\n조수석에 색종이로 접은 지폐가 놓여 있다. 회사는 이런 것도 받는다.',
 bad:'정신을 차려 보니 당신은 2층 계단참에 서 있다. 손에는 물이 담긴 컵. 컵 바닥에 머리카락이 가라앉아 있다.\n어떻게 차로 돌아왔는지는 기억나지 않는다.'},

black:{model:'black',ghost:true,name:'말이 없는 손님',dest:'폐병원',dist:1.1,fare:44400,limit:3,side:true,meterBack:true,who:'……',
 intro:['구파발. 손을 든 사람은 없었다.','그런데 뒷문이 열렸다 닫혔고, 미터기가 저절로 올라갔고, 네비에 목적지가 찍혔다. 폐병원.','룸미러 아래쪽에, 불빛 두 개가 떠 있다.'],
 beats:[
 {text:'뒷좌석은 조용하다. 숨소리도, 옷 스치는 소리도 없다. 다만 차가 무겁다. 한 사람의 무게가 아니다.',
  choices:[{t:'"어디로 모실까요?"',san:-10,doom:1,out:[{who:'……',t:'어디로 모실까요.'},'대답이 돌아온다. 당신의 목소리로. 억양까지 똑같다. 조금 늦게, 조금 낮게.']},
   {t:'"폐병원 맞으십니까?"',san:-8,doom:1,out:[{who:'……',t:'맞으십니까.'},'그것은 지금 말을 배우고 있다. 당신에게서.']}],
  silence:{san:2,out:'당신은 묻지 않는다. 묻지 않아도 되는 손님이 있다. 불빛 두 개가 천천히, 한 번 깜빡인다.'}},
 {navi:{noArrow:true,glitch:.2},text:'통일로. 미터기 숫자가 거꾸로 간다. 0이 되면 무슨 일이 생기는지 당신은 알고 싶지 않다.\n뒷좌석에서 손톱으로 시트를 긁는 소리.',
  choices:[{t:'미터기를 다시 누른다',san:-4,fn(){S.meterDir=0},out:'숫자가 멈춘다. 대신 긁는 소리가 운전석 등받이로 옮겨 온다.'},
   {t:'"손님, 불편하신 데 있으십니까."',san:-12,doom:1,scare:1,out:[{who:'……',t:'있으십니까.'},'이번에는 귀 바로 뒤에서. 차가운 것이 목덜미를 스친다. 숨은 아니다. 숨을 쉬지 않으니까.']}],
  silence:{san:0,fn(){S.meterDir=0},out:'당신은 앞만 본다. 앞만 보는 것도 기술이다. 숫자는 저절로 멈춘다.'}},
 {flash:2,auto:-4,text:'가로등이 끊긴 구간. 번개.\n한순간 차 안이 하얗게 드러난다. 당신은 보지 않으려 했다. 그러나 룸미러는 눈높이에 있다.',say:{who:'……',t:'기사님.'},
  choices:[{t:'"네."',san:-15,doom:2,scare:1,out:'대답하는 순간 깨닫는다. 부른 것은 손님이 아니었다.\n대답한 것도, 당신이 아니었다.'},
   {t:'라디오 볼륨을 올린다',san:-3,out:'잡음. 잡음 사이로 누군가 당신의 이름을 읽는다. 사연의 주인공으로.'}],
  silence:{san:3,out:'대답하지 않는다. 부름은 세 번 반복되고, 네 번째는 없다.\n옛날이야기는 대체로 맞는다.'}},
 {stop:1,navi:{dist:0},text:'폐병원. 철문은 열려 있다. 응급실 간판에 불이 한 글자만 들어와 있다.\n손님은 내리지 않는다. 기다리고 있다. 방침을.',
  choices:[{t:'"도착했습니다, 손님."',san:5,out:'한 마디. 방침에 적힌 그대로.\n뒷문이 열린다. 차가 가벼워진다. 한 사람이 내린 것치고는, 너무 많이.'},
   {t:'뒤를 돌아 확인한다',san:-22,doom:3,scare:1,view:'back',out:'얼굴이 있어야 할 자리는 평평하다. 그 평평한 것이, 당신의 코앞에 있다.'}],
  silence:{san:-10,doom:1,out:'당신은 기다린다. 손님도 기다린다. 미터기가 다시 거꾸로 가기 시작한다.\n결국 당신이 졌다. 도착했습니다, 라고 말하는 목소리가 갈라진다.'}}],
 obs:{mirror:(i,n)=>n<1?{t:'룸미러. 어둠 속에 불빛 두 개. 눈이라고 부르기에는 깜빡임이 없다.\n한 번은, 봐도 된다.',san:-4}:{t:'두 번째로 본다. 불빛이 커졌다.\n커진 것이 아니다. 가까워진 것이다.',san:-14,doom:1,scare:1},
  side:()=>({t:'사이드미러. 방금 지나온 도로 한가운데에 검은 사람이 서 있다. 뒷좌석에 탄 것과 같은 윤곽이다.\n그렇다면 지금 뒤에 탄 것은.',san:-7}),
  navi:()=>({t:'폐병원. 1.1 km. 경로 위에 있어야 할 화살표가 없다.\n이 차는 지금, 지도 위에 없다.',san:-3}),
  back:()=>({t:'돌아본다. 번개.\n목이 어깨 쪽으로 꺾여 있다. 손가락은 무릎을 지나 바닥에 닿아 있다. 얼굴이 있어야 할 자리는, 평평하다.',san:-16,doom:1,flash:1})},
 good:'미터기에 요금이 찍혀 있다. 44,400원. 조수석에는 아무것도 없다.\n내일 회사 통장에 입금되어 있을 것이다. 늘 그랬다.',
 bad:'병원 복도. 당신은 접수 창구 앞에 서 있다. 번호표를 쥐고 있다. 444번. 전광판의 숫자는 443이다.\n달려 나와 시동을 건 것은, 아직 당신이었을 것이다.'},
};
const RADIO=['무전기가 지직거린다.\n"14호차. 다음 콜입니다. 손님 정보는… 없네요. 그냥 가 보세요."','"14호차. 방금 손님, 내린 것 확인하셨죠? 확인하셨으면 됐습니다."\n배차실은 그 이상 묻지 않는다.','"14호차. 뒷좌석 비었으면 다음 콜 받으세요. …비었죠?"'];

/* ───────────── 진행 ───────────── */
let clock=0;const hhmm=()=>{const m=clock%1440;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
async function ride(key){const p=P[key];let doom=0,looks={};S.doom=0;S.meter=3800;S.meterDir=p.meterBack?-1:1;
  Object.assign(S.navi,{dest:p.dest,dist:p.dist,twist:0,glitch:0,off:false,noArrow:false});
  S.target=0;await narr(`— ${hhmm()} —`);sfx.door();setPassenger(p.model);roadGhost.visible=!!p.side;sfx.chime(p.ghost);
  await narr(p.intro);S.target=14;
  const ctx={beat:null,i:0,fail:null,async observe(kind){setView(kind);await sleep(420);const n=looks[kind]||0;looks[kind]=n+1;
    const r=p.obs[kind](ctx.i,n,ctx.beat);if(r.flash)lightning();if(r.scare)await scare(p.model);await narr(r.t);doom+=r.doom||0;S.doom=doom;setView('main');await san(r.san)}};
  let flag=0,paid=true;
  for(let i=0;i<p.beats.length;i++){const b=p.beats[i];ctx.beat=b;ctx.i=i;clock+=7+(Math.random()*5|0);
    if(b.navi){Object.assign(S.navi,b.navi);sfx.chime(true)}else S.navi.dist=Math.max(.1,S.navi.dist*.62);
    if(b.stop)S.target=0;if(b.flash)lightning(b.flash);
    await narr(b.text);if(b.auto)await san(b.auto);
    if(b.say){ui.classList.remove('off');const l=b.say;elWho.textContent=l.who;elText.classList.add('said');elNext.hidden=true;typing=true;skip=false;elText.textContent='';
      for(const ch of l.t){if(skip){elText.textContent=l.t;break}elText.textContent+=ch;await sleep(30)}typing=false}
    else elNext.hidden=true;
    const c=await new Promise((res,rej)=>{ctx.fail=rej;choose(b,ctx).then(res)});
    doom+=c.doom||0;S.doom=doom;flag+=c.flag||0;if(c.navi)Object.assign(S.navi,c.navi);if(c.fn)c.fn();if(c.view)setView(c.view);if(c.flash)lightning();
    if(c.scare)await scare(p.model);await narr(c.out);setView('main');await san(c.san);
    if(c.charm){if(flag>=0){S.charm=true;charm.visible=true;paid=false}else{await narr('종이에는 아무 글씨도 없다. 거짓말한 입에는 빈 종이를 준다고, 그녀가 말한다.');paid=false}}
  }
  const bad=doom>=p.limit;sfx.door();setPassenger(null);roadGhost.visible=false;
  if(bad){await narr(p.bad);await san(-14)}else await narr(p.good);
  const fare=bad||!paid?0:p.fare;S.fare+=fare;S.meter=0;return {name:p.name,bad,fare,ghost:p.ghost}}

function lineup(){const g=['wet','child','black'],h=['drunk','shaman'];const a=g.sort(()=>Math.random()-.5).slice(0,2),b=pick(h);
  const o=[a[0],b,a[1]];if(o[0]==='black'){o[0]=o[2];o[2]='black'}return o}
async function run(){S.san=100;S.fare=0;S.charm=false;charm.visible=false;setSan();clock=23*60+47;S.started=true;const log=[];let dead=false;
  try{await narr(['밤 열한 시 사십칠 분. 비.\n배차실은 오늘도 손님의 이름을 알려주지 않는다.','당신은 미터기를 누르고, 룸미러의 각도를 고친다.\n아직은, 빈 좌석이 비친다.']);
    const L=lineup();for(let i=0;i<L.length;i++){log.push(await ride(L[i]));clock+=11;if(i<L.length-1){S.target=10;await narr(RADIO[i%RADIO.length])}}
  }catch(e){if(!(e instanceof Dead))throw e;dead=true;choiceCtl=null;elSide.innerHTML='';elSide.hidden=false;setView('main');
    await scare('black');S.target=0;await narr(['차가 멈춰 있다. 언제부터인지 모른다.','당신은 뒷좌석에 앉아 있다.\n운전석의 모자가, 천천히 이쪽으로 돌아본다.']);}
  S.target=0;S.started=false;ui.classList.add('off');ending(log,dead)}
function ending(log,dead){let best=0;try{best=+localStorage.getItem('makcha.best')||0;if(!dead&&S.fare>best)localStorage.setItem('makcha.best',S.fare)}catch(e){}
  const rank=dead?'미귀환':S.san>=70?'무사 퇴근':S.san>=35?'간신히 퇴근':'퇴근은 했다';
  const o=document.createElement('div');o.className='ov';o.innerHTML=`<div><p class="dim">${dead?'운행 중단':'— 04:00 — 운행 종료'}</p><h2>${rank}</h2>
   <ul>${log.map(r=>`<li>${r.name} · ${r.bad?'내려준 기억이 없다':'내려주었다'} <span class="num">${r.fare?'· '+r.fare.toLocaleString()+'원':''}</span></li>`).join('')||'<li>아무도 내려주지 못했다.</li>'}</ul>
   <p class="num">오늘의 요금 ${S.fare.toLocaleString()}원 · 남은 정신력 ${Math.round(S.san)}</p>
   <p class="dim">${dead?'회사는 내일도 14호차를 내보낼 것이다. 운전사가 누구든.':(S.fare>best&&S.fare?'최고 기록입니다.':'최고 기록 '+Math.max(best,S.fare).toLocaleString()+'원')}</p>
   <button class="go" type="button">다시 운행한다</button></div>`;
  $('#stage').append(o);o.querySelector('button').onclick=()=>{o.remove();S.san=100;setSan();run()};o.querySelector('button').focus()}

$('#mute').onclick=()=>{A.on=!A.on;$('#mute').textContent=A.on?'소리 켬':'소리 끔';if(A.master)A.master.gain.value=A.on?1:0};
$('#start').onclick=()=>{audioInit();$('#title').hidden=true;run()};
try{const b=+localStorage.getItem('makcha.best');if(b)$('#best').textContent+=' · 최고 기록 '+b.toLocaleString()+'원'}catch(e){}
drawNavi();drawMeter();drawRain();S.target=6;requestAnimationFrame(frame);
window.__makcha={S,setView,setPassenger,scare,lightning,P};
})();
</script>
